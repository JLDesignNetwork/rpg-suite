name: "Bug Report"
description: "File a dice rolling error, template layout bug, or command issue in RPG Suite."
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect in RPG Suite!
  - type: textarea
    id: description
    attributes:
      label: Defect Description
      description: What unexpected behavior occurred?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Command / Dice Notation
      description: What command or text selection triggered the issue?
    validations:
      required: true
